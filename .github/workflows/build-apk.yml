name: Build DZpeinture APK (Gratuit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compiler DZpeinture.apk
        run: gradle assembleDebug --no-daemon

      - name: Renommer en DZpeinture.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk DZpeinture.apk

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: DZpeinture-APK
          path: DZpeinture.apk
          retention-days: 90
