name: Build DZpeinture APK (Gratuit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compiler DZpeinture.apk
        run: gradle assembleDebug --no-daemon

      - name: Renommer en DZpeinture.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk DZpeinture.apk

      - name: Publier l'APK en Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZpeinture-APK
          path: DZpeinture.apk
          retention-days: 90

      - name: Publier le lien direct de téléchargement (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: DZpeinture v5.0.0 (Android APK)
          body: |
            Application Android officielle **DZpeinture V5.0.0** (Alger : Oued Romane • Chéraga • Bachdjerrah).
            - 8 produits officiels (dont Enduit de Charge Préparé 20 kg & Enduit Finition 20 kg)
            - Devis 3 méthodes pro (Générale, Retouche, Repeinturé) avec vrais rendements (couches incluses) & GRIP FOND obligatoire en Phase 1
            - Palette 3 955 teintes (Tendances NCS & LEOMIX, Code NCS, Nuancier Site) + supplément couleur (+200 à +1 000 DA/kg) dans Devis & Panier
            - Annuaire Peintres Pro Vérifiés avec notation obligatoire 1 à 5 ★ sous le commentaire
          files: DZpeinture.apk
          make_latest: true
